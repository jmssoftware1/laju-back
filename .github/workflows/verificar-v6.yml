name: Verificar backend LajuStore
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: laju_test
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: laju_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laju_test -d laju_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://laju_test:ci_password_only@127.0.0.1:5432/laju_ci
      CI_DB_TEST: "true"
      DB_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check src/app.js
      - run: node --check src/modulos-v6.js
      - run: node --check src/modulos-v7.js
      - run: node --check src/modulos-operacao.js
      - run: node --check src/modulos-crediario-v8.js
      - run: node --test tests/v7-validacao.test.js
      - run: node --test tests/v7-integracao.test.js
      - run: node --test tests/operacao-integracao.test.js
      - run: node --test tests/crediario-integracao.test.js
      - run: node --test tests/backup-entrega.test.js
