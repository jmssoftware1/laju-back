name: Testar fluxo V7 (PostgreSQL)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lajustore_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lajustore_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lajustore_ci
      DB_SSL: 'false'
      SESSION_SECRET: teste-ci-lajustore-chave-aleatoria-privada-sem-uso-real
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test
      PORT: 39001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check src/modulos-v7.js
      - run: node scripts/test-v7.mjs
